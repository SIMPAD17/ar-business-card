<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
            
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: #fff;
                font-size: 14px;
                padding: 12px 24px;
                background: rgba(0, 0, 0, 0.9);
                border-radius: 25px;
                border: 1px solid rgba(255,255,255,0.3);
                z-index: 1000;
                pointer-events: none;
            }
            
            #tap-hint {
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                color: #fff;
                font-size: 18px;
                font-weight: bold;
                padding: 20px 40px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 30px;
                border: 2px solid #fff;
                z-index: 1001;
                animation: pulse 2s infinite;
                backdrop-filter: blur(10px);
            }
            
            #tap-hint.hidden {
                display: none;
            }
            
            @keyframes pulse {
                0%, 100% { transform: translateX(-50%) scale(1); }
                50% { transform: translateX(-50%) scale(1.08); }
            }
        </style>
    </head>

    <body>
        <div id="status">Point at marker</div>
        <div id="tap-hint">👆 TAP WHITE BUTTONS ABOVE CARD</div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video 
                    id="pfic_ar" 
                    crossOrigin="anonymous" 
                    src="assets/PFIC_AR.mp4" 
                    preload="auto"
                    loop="true"
                    playsinline
                    webkit-playsinline
                    muted
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 1" position="2 4 2"></a-entity>
                
                <!-- VIDEO PLANE - ELEVATED AND VISIBLE -->
                <a-plane
                    id="video-plane"
                    position="0 0.6 0"
                    rotation="-45 0 0"
                    width="1.8"
                    height="1"
                    material="src: #pfic_ar; shader: flat; side: double"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 800; delay: 500"
                    animation__float="property: position; to: 0 0.65 0; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1300"
                ></a-plane>
                
                <!-- Ground site image - LOWER -->
                <a-image 
                    src="assets/PFIC_SITE.JPG"
                    width="1.6" 
                    height=".9" 
                    position="0 0.05 0"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 0.8; dur: 800; delay: 100"
                ></a-image>
                
                <!-- Other Images -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.2 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                ></a-image>
                
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.2 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400"
                    animation__float="property: position; to: -.42 0.23 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.2 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600"
                    animation__float="property: position; to: -.3 0.24 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.2 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800"
                    animation__float="property: position; to: 1 0.24 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.2 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000"
                    animation__float="property: position; to: 1.32 0.23 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>

                <!-- 3D Models -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 30000; loop: true; easing: linear; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 25000; loop: true; easing: linear; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- INTERACTIVE MENU - Very high and large -->
                <a-entity id="menu" position="0 1 -0.5">
                    
                    <!-- Play/Pause Button -->
                    <a-entity
                        id="video-btn"
                        position="-0.4 0 0"
                        class="clickable"
                    >
                        <a-box
                            width="0.7"
                            height="0.25"
                            depth="0.06"
                            color="#fff"
                            opacity="0"
                            animation="property: opacity; to: 1; dur: 800; delay: 2000"
                            animation__pulse="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine; delay: 2800"
                        >
                            <a-text
                                id="video-text"
                                value="▶ PLAY"
                                align="center"
                                color="#000"
                                width="2.8"
                                position="0 0 0.035"
                            ></a-text>
                        </a-box>
                    </a-entity>
                    
                    <!-- Info Button -->
                    <a-entity
                        id="info-btn"
                        position="0.4 0 0"
                        class="clickable"
                    >
                        <a-box
                            width="0.7"
                            height="0.25"
                            depth="0.06"
                            color="#fff"
                            opacity="0"
                            animation="property: opacity; to: 1; dur: 800; delay: 2200"
                            animation__pulse="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine; delay: 3000"
                        >
                            <a-text
                                value="ℹ INFO"
                                align="center"
                                color="#000"
                                width="2.8"
                                position="0 0 0.035"
                            ></a-text>
                        </a-box>
                    </a-entity>
                    
                </a-entity>
                
                <!-- Info Panel -->
                <a-entity
                    id="info-panel"
                    position="0 1 -0.3"
                    visible="false"
                >
                    <a-plane
                        width="2.8"
                        height="2.2"
                        color="#000"
                        opacity="0.95"
                    >
                        <a-plane
                            width="2.85"
                            height="2.25"
                            color="#fff"
                            opacity="0.3"
                            position="0 0 -0.01"
                        ></a-plane>
                    </a-plane>
                    
                    <a-text
                        value="SIMON PADRON"
                        align="center"
                        color="#fff"
                        width="2.4"
                        position="0 0.9 0.01"
                    ></a-text>
                    
                    <a-text
                        value="Filtration Engineer\nParker Hannifin PFIC"
                        align="center"
                        color="#ccc"
                        width="2.2"
                        position="0 0.6 0.01"
                        line-height="50"
                    ></a-text>
                    
                    <a-text
                        value="Ph.D. Student | Membrane Science\n\nSpecializations:\n• Nanofiber Production\n• CFD/FEA Simulation\n• VR Visualization\n• Advanced Analytics"
                        align="center"
                        color="#fff"
                        width="2.3"
                        position="0 0.05 0.01"
                        line-height="48"
                    ></a-text>
                    
                    <!-- LinkedIn Button -->
                    <a-entity
                        id="linkedin-btn"
                        position="0 -0.7 0.01"
                        class="clickable"
                    >
                        <a-box
                            width="1.4"
                            height="0.25"
                            depth="0.05"
                            color="#0077B5"
                        >
                            <a-text
                                value="🔗 LINKEDIN"
                                align="center"
                                color="#fff"
                                width="3.5"
                                position="0 0 0.03"
                            ></a-text>
                        </a-box>
                    </a-entity>
                    
                    <!-- Close Button -->
                    <a-entity
                        id="close-btn"
                        position="1.2 0.95 0.01"
                        class="clickable"
                    >
                        <a-box
                            width="0.25"
                            height="0.25"
                            depth="0.05"
                            color="#fff"
                        >
                            <a-text
                                value="✕"
                                align="center"
                                color="#000"
                                width="2.5"
                                position="0 0 0.03"
                            ></a-text>
                        </a-box>
                    </a-entity>
                </a-entity>
                
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const status = document.getElementById('status');
            const tapHint = document.getElementById('tap-hint');
            const infoPanel = document.querySelector('#info-panel');
            const videoText = document.querySelector('#video-text');
            
            let videoPlaying = false;
            let infoPanelVisible = false;
            
            // Marker events
            marker.addEventListener('markerFound', () => {
                console.log('✅ Marker found!');
                status.textContent = 'AR Active - Tap buttons!';
                
                // Auto-start video
                setTimeout(() => {
                    if (!videoPlaying) {
                        playVideo();
                    }
                }, 1000);
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('❌ Marker lost');
                status.textContent = 'Point at marker';
                if (infoPanelVisible) {
                    hideInfo();
                }
            });
            
            // Play video function
            function playVideo() {
                console.log('Attempting to play video...');
                video.play().then(() => {
                    console.log('✅ Video playing!');
                    videoPlaying = true;
                    videoText.setAttribute('value', '⏸ PAUSE');
                    tapHint.classList.add('hidden');
                }).catch(e => {
                    console.error('❌ Video play failed:', e);
                    console.log('Video state:', {
                        paused: video.paused,
                        muted: video.muted,
                        readyState: video.readyState,
                        src: video.src
                    });
                });
            }
            
            // Video button - using mousedown for better mobile support
            const videoBtn = document.querySelector('#video-btn');
            videoBtn.addEventListener('click', function(e) {
                console.log('🎬 Video button CLICKED!');
                e.stopPropagation();
                
                if (!videoPlaying) {
                    playVideo();
                } else {
                    video.pause();
                    videoPlaying = false;
                    videoText.setAttribute('value', '▶ PLAY');
                    console.log('⏸ Video paused');
                }
            });
            
            // Also try mousedown
            videoBtn.addEventListener('mousedown', function(e) {
                console.log('🎬 Video button MOUSEDOWN!');
            });
            
            // Info button
            const infoBtn = document.querySelector('#info-btn');
            infoBtn.addEventListener('click', function(e) {
                console.log('ℹ️ Info button CLICKED!');
                e.stopPropagation();
                
                if (!infoPanelVisible) {
                    showInfo();
                } else {
                    hideInfo();
                }
            });
            
            function showInfo() {
                console.log('Showing info panel');
                infoPanel.setAttribute('visible', true);
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    from: '0.1 0.1 0.1',
                    to: '1 1 1',
                    dur: 400,
                    easing: 'easeOutBack'
                });
                infoPanelVisible = true;
            }
            
            function hideInfo() {
                console.log('Hiding info panel');
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    to: '0.1 0.1 0.1',
                    dur: 300
                });
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                infoPanelVisible = false;
            }
            
            // Close button
            const closeBtn = document.querySelector('#close-btn');
            closeBtn.addEventListener('click', function(e) {
                console.log('✕ Close button clicked');
                e.stopPropagation();
                hideInfo();
            });
            
            // LinkedIn button
            const linkedinBtn = document.querySelector('#linkedin-btn');
            linkedinBtn.addEventListener('click', function(e) {
                console.log('🔗 LinkedIn button clicked');
                e.stopPropagation();
                window.open('https://www.linkedin.com/in/simonpadron/', '_blank');
            });
            
            // Tap screen to start video
            document.addEventListener('touchstart', (e) => {
                console.log('📱 Screen touched');
                if (!videoPlaying) {
                    playVideo();
                }
            });
            
            // Video events for debugging
            video.addEventListener('loadeddata', () => {
                console.log('✅ Video loaded successfully');
            });
            
            video.addEventListener('error', (e) => {
                console.error('❌ Video error:', video.error);
            });
            
            video.addEventListener('play', () => {
                console.log('▶️ Video play event fired');
            });
            
            video.addEventListener('playing', () => {
                console.log('🎬 Video is playing');
            });
        </script>
    
    </body>
</html>
