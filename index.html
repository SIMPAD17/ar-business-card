<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
            
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.8);
                font-size: 13px;
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.7);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                z-index: 1000;
                pointer-events: none;
            }
        </style>
    </head>

    <body>
        <div id="status">Point camera at marker</div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video 
                    id="pfic_ar" 
                    crossOrigin="anonymous" 
                    src="assets/PFIC_AR.mp4" 
                    preload="auto"
                    loop="true"
                    playsinline
                    webkit-playsinline
                    muted
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 1" position="2 4 2"></a-entity>
                
                <!-- VIDEO PLANE - Elevated and visible -->
                <a-plane
                    position="0 0.6 0"
                    rotation="-45 0 0"
                    width="1.8"
                    height="1"
                    material="src: #pfic_ar; shader: flat; side: double"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 800; delay: 500"
                    animation__float="property: position; to: 0 0.65 0; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1300"
                ></a-plane>
                
                <!-- Ground site image -->
                <a-image 
                    src="assets/PFIC_SITE.JPG"
                    width="1.6" 
                    height=".9" 
                    position="0 0.05 0"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 0.8; dur: 800; delay: 100"
                ></a-image>
                
                <!-- Your Photo -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.2 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                ></a-image>
                
                <!-- CLICKABLE INFO INDICATOR - Next to your photo -->
                <a-entity 
                    id="info-indicator"
                    position="1.65 0.35 -.1"
                    rotation="-90 0 0"
                    class="clickable"
                >
                    <!-- Outer pulse ring -->
                    <a-ring
                        radius-inner="0.12"
                        radius-outer="0.15"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 0.6; dur: 600; delay: 2000"
                        animation__pulse="property: scale; to: 1.4 1.4 1.4; loop: true; dur: 1500; easing: easeInOutSine; delay: 2600"
                        animation__fade="property: opacity; from: 0.6; to: 0.2; loop: true; dur: 1500; easing: easeInOutSine; delay: 2600"
                    ></a-ring>
                    
                    <!-- Main circle button -->
                    <a-circle
                        radius="0.12"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 0.95; dur: 600; delay: 2000"
                        position="0 0 0.01"
                    >
                        <!-- Info icon -->
                        <a-text
                            value="i"
                            align="center"
                            color="#000"
                            width="0.8"
                            position="0 0 0.02"
                            wrap-count="1"
                        ></a-text>
                    </a-circle>
                    
                    <!-- Tap me text -->
                    <a-text
                        value="TAP"
                        align="center"
                        color="#fff"
                        width="0.4"
                        position="0 -0.2 0.02"
                        opacity="0"
                        animation="property: opacity; to: 0.9; dur: 600; delay: 2200"
                        animation__pulse="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine; delay: 2800"
                    ></a-text>
                </a-entity>
                
                <!-- Other Images -->
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.2 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400"
                    animation__float="property: position; to: -.42 0.23 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.2 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600"
                    animation__float="property: position; to: -.3 0.24 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.2 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800"
                    animation__float="property: position; to: 1 0.24 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.2 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000"
                    animation__float="property: position; to: 1.32 0.23 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>

                <!-- 3D Models -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 30000; loop: true; easing: linear; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 25000; loop: true; easing: linear; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- MODERN INFO PANEL - Glassmorphism style -->
                <a-entity
                    id="info-panel"
                    position="0 0.8 -0.2"
                    visible="false"
                >
                    <!-- Semi-transparent dark panel with border -->
                    <a-plane
                        width="3"
                        height="2.5"
                        color="#000"
                        opacity="0"
                        material="transparent: true; opacity: 0.9"
                    >
                        <!-- Glowing border effect -->
                        <a-plane
                            width="3.05"
                            height="2.55"
                            color="#fff"
                            opacity="0.15"
                            position="0 0 -0.01"
                        ></a-plane>
                        
                        <!-- Top accent line -->
                        <a-plane
                            width="3"
                            height="0.01"
                            color="#fff"
                            opacity="0.5"
                            position="0 1.245 0.01"
                        ></a-plane>
                    </a-plane>
                    
                    <!-- Content Container -->
                    <a-entity position="0 0 0.02">
                        
                        <!-- Name - Large -->
                        <a-text
                            value="SIMON PADRON"
                            align="center"
                            color="#fff"
                            width="2.6"
                            position="0 1 0"
                            letter-spacing="2"
                        ></a-text>
                        
                        <!-- Title -->
                        <a-text
                            value="Filtration Engineer"
                            align="center"
                            color="#ccc"
                            width="2.2"
                            position="0 0.7 0"
                        ></a-text>
                        
                        <!-- Company -->
                        <a-text
                            value="Parker Hannifin PFIC"
                            align="center"
                            color="#aaa"
                            width="2"
                            position="0 0.5 0"
                        ></a-text>
                        
                        <!-- Divider line -->
                        <a-plane
                            width="2.5"
                            height="0.005"
                            color="#fff"
                            opacity="0.2"
                            position="0 0.3 0"
                        ></a-plane>
                        
                        <!-- Education -->
                        <a-text
                            value="Ph.D. Student"
                            align="center"
                            color="#fff"
                            width="2"
                            position="0 0.05 0"
                        ></a-text>
                        
                        <a-text
                            value="Membrane Science & Hollow Fiber\nPolyimide Membranes"
                            align="center"
                            color="#bbb"
                            width="2.2"
                            position="0 -0.2 0"
                            line-height="45"
                        ></a-text>
                        
                        <!-- Specializations -->
                        <a-text
                            value="Specializations"
                            align="center"
                            color="#fff"
                            width="1.8"
                            position="0 -0.5 0"
                        ></a-text>
                        
                        <a-text
                            value="Nanofiber Production • CFD/FEA Simulation\nVR Visualization • Advanced Analytics"
                            align="center"
                            color="#aaa"
                            width="2.4"
                            position="0 -0.75 0"
                            line-height="45"
                        ></a-text>
                        
                    </a-entity>
                    
                    <!-- LinkedIn Button - Modern style -->
                    <a-entity
                        id="linkedin-btn"
                        position="0 -1.05 0.02"
                        class="clickable"
                    >
                        <a-plane
                            width="1.6"
                            height="0.3"
                            color="#0077B5"
                            opacity="1"
                        >
                            <!-- Button glow -->
                            <a-plane
                                width="1.65"
                                height="0.35"
                                color="#0077B5"
                                opacity="0.3"
                                position="0 0 -0.01"
                            ></a-plane>
                            
                            <a-text
                                value="CONNECT ON LINKEDIN"
                                align="center"
                                color="#fff"
                                width="4"
                                position="0 0 0.01"
                                letter-spacing="1"
                            ></a-text>
                        </a-plane>
                    </a-entity>
                    
                    <!-- Close Button - Top right corner -->
                    <a-entity
                        id="close-btn"
                        position="1.35 1.1 0.02"
                        class="clickable"
                    >
                        <a-circle
                            radius="0.15"
                            color="#fff"
                            opacity="0.9"
                        >
                            <a-text
                                value="✕"
                                align="center"
                                color="#000"
                                width="1.2"
                                position="0 0 0.01"
                            ></a-text>
                        </a-circle>
                    </a-entity>
                </a-entity>
                
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const status = document.getElementById('status');
            const infoIndicator = document.querySelector('#info-indicator');
            const infoPanel = document.querySelector('#info-panel');
            
            let infoPanelVisible = false;
            
            // Marker events
            marker.addEventListener('markerFound', () => {
                console.log('✅ Marker detected!');
                status.textContent = 'AR Active - Tap info icon';
                
                // Auto-start video
                setTimeout(() => {
                    video.play().then(() => {
                        console.log('✅ Video playing');
                    }).catch(e => {
                        console.log('Video autoplay prevented');
                    });
                }, 1000);
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('❌ Marker lost');
                status.textContent = 'Point camera at marker';
                if (infoPanelVisible) {
                    hideInfoPanel();
                }
            });
            
            // Info indicator click - Using mousedown for better mobile response
            infoIndicator.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                console.log('ℹ️ Info indicator clicked!');
                showInfoPanel();
            });
            
            // Also add click event as fallback
            infoIndicator.addEventListener('click', function(e) {
                e.stopPropagation();
                console.log('ℹ️ Info indicator clicked (click event)!');
                if (!infoPanelVisible) {
                    showInfoPanel();
                }
            });
            
            function showInfoPanel() {
                console.log('Showing info panel...');
                infoPanel.setAttribute('visible', true);
                
                // Fade in animation
                const panel = infoPanel.querySelector('a-plane');
                panel.setAttribute('animation', {
                    property: 'opacity',
                    from: 0,
                    to: 0.9,
                    dur: 500,
                    easing: 'easeOutQuad'
                });
                
                // Scale in animation
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    from: '0.8 0.8 0.8',
                    to: '1 1 1',
                    dur: 500,
                    easing: 'easeOutBack'
                });
                
                infoPanelVisible = true;
                status.textContent = 'Viewing info';
            }
            
            function hideInfoPanel() {
                console.log('Hiding info panel...');
                
                // Fade out
                const panel = infoPanel.querySelector('a-plane');
                panel.setAttribute('animation', {
                    property: 'opacity',
                    to: 0,
                    dur: 300
                });
                
                // Scale out
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    to: '0.8 0.8 0.8',
                    dur: 300
                });
                
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                
                infoPanelVisible = false;
                status.textContent = 'AR Active - Tap info icon';
            }
            
            // Close button
            const closeBtn = document.querySelector('#close-btn');
            closeBtn.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                console.log('✕ Close button clicked');
                hideInfoPanel();
            });
            
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                console.log('✕ Close button clicked (click event)');
                hideInfoPanel();
            });
            
            // LinkedIn button
            const linkedinBtn = document.querySelector('#linkedin-btn');
            linkedinBtn.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                console.log('🔗 LinkedIn button clicked');
                window.open('https://www.linkedin.com/in/simonpadron/', '_blank');
            });
            
            linkedinBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                console.log('🔗 LinkedIn button clicked (click event)');
            });
            
            // Video events
            video.addEventListener('loadeddata', () => {
                console.log('✅ Video loaded');
            });
            
            video.addEventListener('error', (e) => {
                console.error('❌ Video error:', video.error);
            });
        </script>
    
    </body>
</html>
