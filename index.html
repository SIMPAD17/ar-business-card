<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Business Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
            #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.9); font-size: 12px; padding: 10px 20px; background: rgba(0,0,0,0.85); border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); z-index: 1000; pointer-events: none; backdrop-filter: blur(10px); }
            #tap-instruction { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; font-weight: bold; padding: 12px 24px; background: rgba(0, 0, 0, 0.9); border-radius: 25px; border: 2px solid #fff; z-index: 1001; animation: pulse 2s infinite; backdrop-filter: blur(10px); }
            #tap-instruction.hidden { display: none; }
            .ar-button { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 12px; font-weight: bold; padding: 10px 20px; background: rgba(0, 119, 181, 0.95); border-radius: 25px; border: 2px solid #fff; z-index: 1002; cursor: pointer; backdrop-filter: blur(10px); white-space: nowrap; }
            .ar-button:hover { background: rgba(0, 119, 181, 1); transform: translateX(-50%) scale(1.05); }
            @keyframes pulse { 0%,100%{ transform: translateX(-50%) scale(1);} 50%{ transform: translateX(-50%) scale(1.06);} }
        </style>
    </head>

    <body>
        <div id="status">Point camera at marker</div>
        <div id="tap-instruction">TAP FOR INFO</div>
        <div id="btn-asset-linkedin-button" class="ar-button" data-frames="2" data-url="https://www.linkedin.com/in/simonpadron" style="display:none;">CONNECT ON LINKEDIN</div>
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video id="vid-asset-video" crossOrigin="anonymous" src="assets/PFIC_AR.mp4" preload="auto" loop playsinline webkit-playsinline muted></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 1" position="2 4 2"></a-entity>

                <a-plane data-asset-id="asset-video"
                    position="-2 0.1 -0.6"
                    rotation="-90 0 0"
                    width="1.8"
                    height="1"
                    material="src: #vid-asset-video; shader: flat; side: double"
                ></a-plane>

                <a-image data-asset-id="asset-simon-photo"
                    src="assets/simon.png"
                    position="1.8 0.2 -0.7"
                    rotation="-90 0 0"
                    scale="1 1 1"
                ></a-image>

                <a-image data-asset-id="asset-parker-logo"
                    src="assets/parker-logo.jpg"
                    position="-2.4 0.2 -1.3"
                    rotation="-90 0 0"
                    scale="0.8 0.25 0.25"
                ></a-image>

                <a-image data-asset-id="asset-parker-2"
                    src="assets/parker_2.jpg"
                    position="0 0.2 1.5"
                    rotation="-90 0 0"
                    scale="2 0.6 0.5"
                ></a-image>

                <a-image data-asset-id="asset-pfic-name"
                    src="assets/pfic-name.png"
                    position="0 0.2 -1.3"
                    rotation="-90 0 0"
                    scale="2 0.25 0.25"
                ></a-image>

                <a-image data-asset-id="asset-simon-name"
                    src="assets/simon-name.png"
                    position="1.32 0.2 0.4"
                    rotation="-90 0 0"
                    scale="0.75 0.18 0.18"
                ></a-image>

                <a-entity data-asset-id="asset-spinneret"
                    position="1.7 0 0.5"
                    rotation="0 0 0"
                    scale="0.4 0.4 0.4"
                    class="clickable" gesture-handler>
                    <a-entity gltf-model="url(assets/spinneret-stress.glb)" animation-mixer="loop: repeat" animation__rotate="property: rotation; to: 0 360 0; dur: 12000; loop: true; easing: linear"></a-entity>
                </a-entity>

                <a-entity data-asset-id="asset-filter"
                    position="-1.9 0.3 0.5"
                    rotation="90 0 0"
                    scale="1.4 1.4 1.4"
                    class="clickable" gesture-handler>
                    <a-entity gltf-model="url(assets/Parker_filter_2.glb)" animation-mixer="loop: repeat" animation__rotate="property: rotation; to: 0 360 0; dur: 12000; loop: true; easing: linear"></a-entity>
                </a-entity>

                <a-entity data-asset-id="asset-panel-text" position="0 0.330 0" rotation="-90 0 0" scale="1 1 1" render-order="999">
                    <a-text value="SIMON PADRON
Technology Leader
Parker Hannifin


Presently: Leading cross-functional teams at Parker Hannifin’s Filtration Innovation Center to design, validate, and launch next-generation solutions across filtration, separation, and clean energy.

Background: With 15+ years of experience in research and development, I bring a solid foundation in analytical and problem-solving skills. My expertise in simulation, statistical and AI techniques underpins my approach to innovative design and product development.

Education: Currently broadening my expertise as I pursue a PhD in Interdisciplinary Engineering at Texas A&M University, while continuously engaging with the latest technological advancements through conferences, workshops, and self-directed learning." align="center" color="#ffffff" width="1.8" position="0 0.02 -0.1000"></a-text>
                </a-entity>

                <a-entity data-asset-id="asset-panel" position="0 0.25 0" rotation="0 0 0" scale="1 1 1">
                    <a-entity scale="0.9 1 1.2">
                        <a-plane width="2.2" height="1.8" color="#000000" material="side: double; opacity: 1" rotation="-90 0 0" position="0 0 0"></a-plane>
                    </a-entity>
                </a-entity>

            </a-marker>

            <a-entity camera>
                <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable; far: 20"></a-entity>
            </a-entity>
        </a-scene>
    
        <script>
            // Force render order for specific entities (e.g., panel text)
            if (window.AFRAME) {
                AFRAME.registerComponent('render-order', {
                    schema: {default: 0},
                    init: function() {
                        const apply = () => {
                            this.el.object3D.traverse((node) => {
                                if (node.isMesh) {
                                    node.renderOrder = this.data;
                                    if (node.material) {
                                        node.material.depthTest = false;
                                        node.material.depthWrite = false;
                                        node.material.needsUpdate = true;
                                    }
                                }
                            });
                        };
                        this.el.addEventListener('object3dset', apply);
                        this.el.addEventListener('loaded', apply);
                        setTimeout(apply, 100);
                        setTimeout(apply, 500);
                    }
                });
            }

            (function(){
                const marker = document.querySelector('a-marker');
                const status = document.getElementById('status');
                const tapInstruction = document.getElementById('tap-instruction');
                const videos = Array.from(document.querySelectorAll('a-assets > video'));

                let markerVisible = false;
                marker.addEventListener('markerFound', () => {
                    markerVisible = true;
                    status.textContent = 'AR Active';
                    setTimeout(() => { videos.forEach(v => { try { v.play(); } catch(e) {} }); }, 500);
                    // Initialize to the first frame's state so visibility/positions match Frame 1
                    setTimeout(() => { try { animateTo(activeFrame); tapInstruction.textContent = 'TAP FOR INFO'; } catch(e) {} }, 100);
                });
                marker.addEventListener('markerLost', () => {
                    markerVisible = false;
                    status.textContent = 'Point camera at marker';
                });

                // Choreography based on differences between first two frames
                const frames = ["1","2"];
                const assets = [{"id":"asset-video","name":"video-plane","type":"video","source":"assets/PFIC_AR.mp4","position":{"x":-2,"y":0.1,"z":-0.6},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1},"states":{"1":{"position":{"x":-0.2,"y":0.2,"z":0},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1}},"2":{"position":{"x":-2,"y":0.1,"z":-0.6},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1}}}},{"id":"asset-simon-photo","name":"simon-photo","type":"image","source":"assets/simon.png","position":{"x":1.8,"y":0.2,"z":-0.7},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1},"states":{"1":{"position":{"x":1.3,"y":0.2,"z":-0.1},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.8,"y":0.8,"z":0.8}},"2":{"position":{"x":1.8,"y":0.25,"z":-0.7},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1}}}},{"id":"asset-parker-logo","name":"parker-logo","type":"image","source":"assets/parker-logo.jpg","position":{"x":-2.4,"y":0.2,"z":-1.3},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.8,"y":0.25,"z":0.25},"states":{"1":{"position":{"x":-1.6,"y":0.2,"z":-0.7},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.8,"y":0.25,"z":0.25}},"2":{"position":{"x":-2.4,"y":0.23,"z":-1.3},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.75,"y":0.25,"z":0.25}}}},{"id":"asset-parker-2","name":"parker-2","type":"image","source":"assets/parker_2.jpg","position":{"x":0,"y":0.2,"z":1.5},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":2,"y":0.6,"z":0.5},"states":{"1":{"position":{"x":-1.2,"y":0.2,"z":0.9},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1.5,"y":0.5,"z":0.5}},"2":{"position":{"x":0,"y":0.24,"z":1.5},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":2,"y":0.6,"z":0.5}}}},{"id":"asset-pfic-name","name":"pfic-name","type":"image","source":"assets/pfic-name.png","position":{"x":0,"y":0.2,"z":-1.3},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":2,"y":0.25,"z":0.25},"states":{"1":{"position":{"x":0,"y":0.2,"z":-0.7},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":2,"y":0.25,"z":0.25}},"2":{"position":{"x":0,"y":0.24,"z":-1.3},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":2,"y":0.25,"z":0.25}}}},{"id":"asset-simon-name","name":"simon-name","type":"image","source":"assets/simon-name.png","position":{"x":1.32,"y":0.2,"z":0.4},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.75,"y":0.18,"z":0.18},"states":{"1":{"position":{"x":1.32,"y":0.2,"z":0.4},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.75,"y":0.18,"z":0.18}}}},{"id":"asset-spinneret","name":"spinneret-stress","type":"model","source":"assets/spinneret-stress.glb","position":{"x":1.7,"y":0,"z":0.5},"rotation":{"x":0,"y":0,"z":0},"scale":{"x":0.4,"y":0.4,"z":0.4},"states":{"1":{"position":{"x":0.3,"y":0,"z":0.9},"rotation":{"x":0,"y":0,"z":0},"scale":{"x":0.25,"y":0.25,"z":0.25}},"2":{"position":{"x":1.7,"y":0.4,"z":0.5},"rotation":{"x":0,"y":0,"z":0},"scale":{"x":0.4,"y":0.4,"z":0.4}}},"meta":{"animRotateEnable":true}},{"id":"asset-filter","name":"Parker_filter_2","type":"model","source":"assets/Parker_filter_2.glb","position":{"x":-1.9,"y":0.3,"z":0.5},"rotation":{"x":90,"y":0,"z":0},"scale":{"x":1.4,"y":1.4,"z":1.4},"states":{"1":{"position":{"x":-1.6,"y":0.3,"z":0},"rotation":{"x":90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1}},"2":{"position":{"x":-1.9,"y":0.35,"z":0.5},"rotation":{"x":90,"y":0,"z":0},"scale":{"x":1.4,"y":1.4,"z":1.4}}},"meta":{"animRotateEnable":true}},{"id":"asset-panel","name":"info-panel","type":"panel","source":"assets/PFIC_SITE.JPG","position":{"x":0,"y":0.25,"z":0},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.9,"y":1.2,"z":1},"states":{"2":{"position":{"x":0,"y":0.25,"z":0},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":0.9,"y":1.2,"z":1},"meta":{"panelText":"TITLE\nSubtitle\n---\nMore Info","bgColor":"#2d3436","textColor":"#ffffff","textWidth":1.8,"opacity":0.9}}},"meta":{"panelText":"SIMON PADRON\nTechnology Leader\nParker Hannifin\n\n\nPresently: Leading cross-functional teams at Parker Hannifin’s Filtration Innovation Center to design, validate, and launch next-generation solutions across filtration, separation, and clean energy.\n\nBackground: With 15+ years of experience in research and development, I bring a solid foundation in analytical and problem-solving skills. My expertise in simulation, statistical and AI techniques underpins my approach to innovative design and product development.\n\nEducation: Currently broadening my expertise as I pursue a PhD in Interdisciplinary Engineering at Texas A&M University, while continuously engaging with the latest technological advancements through conferences, workshops, and self-directed learning.","bgColor":"#000000","textColor":"#ffffff","textWidth":1.8,"opacity":0.9}},{"id":"asset-linkedin-button","name":"linkedin-button","type":"button","position":{"x":0,"y":0.2,"z":-0.65},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1},"meta":{"label":"CONNECT ON LINKEDIN","url":"https://www.linkedin.com/in/simonpadron","color":"#0077B5","textColor":"#ffffff","textWidth":1,"opacity":0.9},"states":{"2":{"position":{"x":0,"y":0.2,"z":-0.65},"rotation":{"x":-90,"y":0,"z":0},"scale":{"x":1,"y":1,"z":1}}}}];
                let activeFrame = frames[0] || '1';

                function animateTo(frame){
                    (assets||[]).forEach(a => {
                        const st = (a.states && a.states[frame]) || null;
                        if (a.type === 'button') {
                            // Handle button overlay visibility
                            const btn = document.getElementById('btn-' + a.id);
                            if (btn) btn.style.display = st ? 'block' : 'none';
                            return;
                        }
                        const el = document.querySelector('[data-asset-id="' + a.id + '"]');
                        if (!el) return;
                        if (!st) {
                            // No state in this frame: hide element
                            el.setAttribute('visible', false);
                            // Hide associated panel text if this is a panel
                            if (a.type === 'panel') {
                                const textEl = document.querySelector('[data-asset-id="' + a.id + '-text"]');
                                if (textEl) textEl.setAttribute('visible', false);
                            }
                            return;
                        }
                        const pos = st.position || a.position || {x:0,y:0,z:0};
                        const rot = st.rotation || a.rotation || {x:0,y:0,z:0};
                        const scl = st.scale || a.scale || {x:1,y:1,z:1};
                        el.setAttribute('visible', true);
                        el.setAttribute('animation__pos', { property: 'position', to: (pos.x + ' ' + pos.y + ' ' + pos.z), dur: 500, easing: 'easeOutQuad' });
                        if (a.type === 'panel') {
                            // Match index.html: keep wrapper neutral, rotate child plane/text -90
                            el.setAttribute('rotation', '0 0 0');
                            // Sync separate text entity with panel visibility and position
                            const textEl = document.querySelector('[data-asset-id="' + a.id + '-text"]');
                            if (textEl) {
                                const textYOffset = 0.08;
                                textEl.setAttribute('visible', true);
                                textEl.setAttribute('rotation', '-90 0 0');
                                textEl.setAttribute('animation__pos', { property: 'position', to: (pos.x + ' ' + (pos.y + textYOffset) + ' ' + pos.z), dur: 500, easing: 'easeOutQuad' });
                            }
                        } else {
                            el.setAttribute('animation__rot', { property: 'rotation', to: ((rot.x||0) + ' ' + (rot.y||0) + ' ' + (rot.z||0)), dur: 500, easing: 'easeOutQuad' });
                        }
                        // Scale animation applies to all
                        el.setAttribute('animation__scl', { property: 'scale', to: ((scl.x||1) + ' ' + (scl.y||1) + ' ' + (scl.z||1)), dur: 500, easing: 'easeOutQuad' });
                    });
                    // Safety: after loop, ensure panel text mirrors panel visibility
                    (assets||[]).filter(a => a.type === 'panel').forEach(a => {
                        const panelEl = document.querySelector('[data-asset-id="' + a.id + '"]');
                        const textEl = document.querySelector('[data-asset-id="' + a.id + '-text"]');
                        if (panelEl && textEl) {
                            const vis = panelEl.getAttribute('visible');
                            textEl.setAttribute('visible', vis !== false);
                        }
                    });
                }

                function toggleFrame(){
                    if (!frames || frames.length < 2) return;
                    const idx = frames.indexOf(activeFrame);
                    const next = frames[(idx + 1) % frames.length];
                    animateTo(next);
                    activeFrame = next;
                    // Mirror index.html UX text changes
                    if (activeFrame === (frames[0] || '1')) {
                        tapInstruction.textContent = 'TAP FOR INFO';
                    } else {
                        tapInstruction.textContent = 'TAP TO CLOSE';
                    }
                }

                // Tap/click anywhere to toggle frames (but not on buttons or clickables)
                document.addEventListener('touchstart', (e) => { 
                    if (markerVisible && !e.target.closest('.ar-button') && !e.target.closest('.clickable')) toggleFrame(); 
                });
                document.addEventListener('click', (e) => { 
                    if (markerVisible && !e.target.closest('.ar-button') && !e.target.closest('.clickable')) toggleFrame(); 
                });

                // Button click handlers for HTML overlays
                document.addEventListener('click', (e) => {
                    const btn = e.target.closest('.ar-button');
                    if (btn) {
                        const u = btn.getAttribute('data-url');
                        if (u && u !== '#') window.open(u, '_blank');
                        e.stopPropagation();
                    }
                }, true);
            })();
        </script>
    
    </body>
</html>
