<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
            
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.9);
                font-size: 12px;
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.85);
                border-radius: 20px;
                border: 1px solid rgba(255,255,255,0.3);
                z-index: 1000;
                pointer-events: none;
                backdrop-filter: blur(10px);
            }
            
            #tap-instruction {
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                color: #fff;
                font-size: 14px;
                font-weight: bold;
                padding: 12px 24px;
                background: rgba(0, 0, 0, 0.9);
                border-radius: 25px;
                border: 2px solid #fff;
                z-index: 1001;
                animation: pulse 2s infinite;
                backdrop-filter: blur(10px);
            }
            
            #tap-instruction.hidden {
                display: none;
            }
            
            @keyframes pulse {
                0%, 100% { transform: translateX(-50%) scale(1); }
                50% { transform: translateX(-50%) scale(1.06); }
            }
        </style>
    </head>

    <body>
        <div id="status">Point camera at marker</div>
        <div id="tap-instruction">TAP FOR INFO</div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video 
                    id="pfic_ar" 
                    crossOrigin="anonymous" 
                    src="assets/PFIC_AR.mp4" 
                    preload="auto"
                    loop="true"
                    playsinline
                    webkit-playsinline
                    muted
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 1" position="2 4 2"></a-entity>
                
                <!-- VIDEO PLANE - Flat on card like other images -->
                <a-plane
                    position="0 0.2 0"
                    rotation="-90 0 0"
                    width="1.8"
                    height="1"
                    material="src: #pfic_ar; shader: flat; side: double"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 800; delay: 500"
                    animation__float="property: position; to: 0 0.25 0; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1300"
                ></a-plane>
                
                <!-- Your Photo -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.2 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                ></a-image>
                
                <!-- Other Images -->
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.2 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400"
                    animation__float="property: position; to: -.42 0.23 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.2 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600"
                    animation__float="property: position; to: -.3 0.24 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.2 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800"
                    animation__float="property: position; to: 1 0.24 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.2 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000"
                    animation__float="property: position; to: 1.32 0.23 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>

                <!-- 3D Models -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 30000; loop: true; easing: linear; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 25000; loop: true; easing: linear; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- INFO PANEL - Centered with Parker site as background -->
                <a-entity
                    id="info-panel"
                    position="0 0.25 0"
                    visible="false"
                >
                    <!-- Background panel - rotated flat -->
                    <a-entity rotation="-90 0 0">
                        <!-- Background image -->
                        <a-image
                            src="assets/PFIC_SITE.JPG"
                            width="2.2"
                            height="1.8"
                            opacity="0.3"
                        ></a-image>
                        
                        <!-- Dark overlay -->
                        <a-plane
                            width="2.2"
                            height="1.8"
                            color="#000"
                            opacity="0"
                            material="transparent: true; opacity: 0.75; side: double"
                            position="0 0 0.001"
                        >
                            <!-- Border -->
                            <a-plane
                                width="2.26"
                                height="1.86"
                                color="#fff"
                                opacity="0.3"
                                position="0 0 0.001"
                                material="side: double"
                            ></a-plane>
                        </a-plane>
                    </a-entity>
                    
                    <!-- Text content - also rotated flat to face up -->
                    <a-entity rotation="-90 0 0" position="0 0.002 0">
                        <!-- Name -->
                        <a-text
                            value="SIMON PADRON"
                            align="center"
                            color="#fff"
                            width="1.8"
                            position="0 0 0.75"
                        ></a-text>
                        
                        <!-- Title -->
                        <a-text
                            value="Technology Leader"
                            align="center"
                            color="#ddd"
                            width="1.6"
                            position="0 0 0.55"
                        ></a-text>
                        
                        <!-- Company -->
                        <a-text
                            value="Parker Hannifin PFIC"
                            align="center"
                            color="#bbb"
                            width="1.6"
                            position="0 0 0.4"
                        ></a-text>
                        
                        <!-- Divider 1 -->
                        <a-plane
                            width="1.8"
                            height="0.008"
                            color="#fff"
                            opacity="0.3"
                            position="0 0.001 0.25"
                        ></a-plane>
                        
                        <!-- Education -->
                        <a-text
                            value="Ph.D. Student"
                            align="center"
                            color="#fff"
                            width="1.5"
                            position="0 0 0.12"
                        ></a-text>
                        
                        <a-text
                            value="Texas A&M"
                            align="center"
                            color="#ccc"
                            width="1.4"
                            position="0 0 -0.02"
                        ></a-text>
                        
                        <!-- Divider 2 -->
                        <a-plane
                            width="1.8"
                            height="0.008"
                            color="#fff"
                            opacity="0.3"
                            position="0 0.001 -0.16"
                        ></a-plane>
                        
                        <!-- Specializations header -->
                        <a-text
                            value="Specializations"
                            align="center"
                            color="#fff"
                            width="1.5"
                            position="0 0 -0.28"
                        ></a-text>
                        
                        <!-- Specializations line 1 -->
                        <a-text
                            value="Filtration R&D • AI • Simulation"
                            align="center"
                            color="#aaa"
                            width="1.9"
                            position="0 0 -0.42"
                        ></a-text>
                        
                        <!-- Specializations line 2 -->
                        <a-text
                            value="AR/VR • Analytics"
                            align="center"
                            color="#aaa"
                            width="1.6"
                            position="0 0 -0.55"
                        ></a-text>
                        
                        <!-- Divider 3 -->
                        <a-plane
                            width="1.8"
                            height="0.008"
                            color="#fff"
                            opacity="0.3"
                            position="0 0.001 -0.68"
                        ></a-plane>
                    </a-entity>
                    
                    <!-- LinkedIn Button - also rotated flat -->
                    <a-entity rotation="-90 0 0" position="0 0.002 0">
                        <a-plane
                            id="linkedin-btn"
                            position="0 0 -0.82"
                            width="1.5"
                            height="0.2"
                            color="#0077B5"
                            opacity="1"
                            class="clickable"
                        >
                            <a-plane
                                position="0 -0.002 0"
                                width="1.55"
                                height="0.24"
                                color="#0077B5"
                                opacity="0.3"
                            ></a-plane>
                            
                            <a-text
                                value="CONNECT ON LINKEDIN"
                                align="center"
                                color="#fff"
                                width="3.5"
                                position="0 0.002 0"
                            ></a-text>
                        </a-plane>
                    </a-entity>
                    
                </a-entity>
                
            </a-marker>

            <a-entity camera>
                <a-entity 
                    cursor="fuse: false; rayOrigin: mouse"
                    raycaster="objects: .clickable; far: 20"
                ></a-entity>
            </a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const status = document.getElementById('status');
            const tapInstruction = document.getElementById('tap-instruction');
            const infoPanel = document.querySelector('#info-panel');
            const linkedinBtn = document.querySelector('#linkedin-btn');
            
            let infoPanelVisible = false;
            let markerVisible = false;
            
            // Marker events
            marker.addEventListener('markerFound', () => {
                console.log('✅ Marker detected!');
                markerVisible = true;
                status.textContent = 'AR Active';
                
                // Auto-start video
                setTimeout(() => {
                    video.play().then(() => {
                        console.log('✅ Video playing');
                    }).catch(e => console.log('Video autoplay prevented'));
                }, 1000);
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('❌ Marker lost');
                markerVisible = false;
                status.textContent = 'Point camera at marker';
                if (infoPanelVisible) {
                    hideInfo();
                }
            });
            
            // TAP ANYWHERE on screen to toggle info
            document.addEventListener('touchstart', (e) => {
                if (markerVisible) {
                    console.log('📱 Screen tapped - toggling info');
                    if (!infoPanelVisible) {
                        showInfo();
                    } else {
                        hideInfo();
                    }
                }
            });
            
            // Also handle click for desktop testing
            document.addEventListener('click', (e) => {
                if (markerVisible && !e.target.closest('.clickable')) {
                    console.log('🖱️ Screen clicked - toggling info');
                    if (!infoPanelVisible) {
                        showInfo();
                    } else {
                        hideInfo();
                    }
                }
            });
            
            function showInfo() {
                console.log('📱 Opening info panel...');
                infoPanel.setAttribute('visible', true);
                
                // Fade in background
                const bgImage = infoPanel.querySelector('a-image');
                if (bgImage) {
                    bgImage.setAttribute('animation', {
                        property: 'opacity',
                        from: 0,
                        to: 0.3,
                        dur: 500
                    });
                }
                
                const overlay = infoPanel.querySelector('a-plane[color="#000"]');
                if (overlay) {
                    overlay.setAttribute('animation', {
                        property: 'material.opacity',
                        from: 0,
                        to: 0.75,
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Scale in panel
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    from: '0.7 0.7 0.7',
                    to: '1 1 1',
                    dur: 500,
                    easing: 'easeOutBack'
                });
                
                // Move Simon's photo right
                const simonPhoto = document.querySelector('a-image[src="assets/simon.JPG"]');
                if (simonPhoto) {
                    simonPhoto.setAttribute('animation__move', {
                        property: 'position',
                        to: '1.9 0.25 -.1',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move Simon's name right
                const simonName = document.querySelector('a-image[src="assets/simon-name.png"]');
                if (simonName) {
                    simonName.setAttribute('animation__move', {
                        property: 'position',
                        to: '1.9 0.23 .35',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move video plane left
                const video = document.querySelector('a-plane[material*="pfic_ar"]');
                if (video) {
                    video.setAttribute('animation__move', {
                        property: 'position',
                        to: '-0.5 0.25 0.5',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move Parker logo left
                const parkerLogo = document.querySelector('a-image[src="assets/parker-logo.jpg"]');
                if (parkerLogo) {
                    parkerLogo.setAttribute('animation__move', {
                        property: 'position',
                        to: '-0.9 0.23 -.62',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move PFIC name left
                const pficName = document.querySelector('a-image[src="assets/pfic-name.png"]');
                if (pficName) {
                    pficName.setAttribute('animation__move', {
                        property: 'position',
                        to: '-0.5 0.24 -.60',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move Parker 2 image left and back
                const parker2 = document.querySelector('a-image[src="assets/parker_2.jpg"]');
                if (parker2) {
                    parker2.setAttribute('animation__move', {
                        property: 'position',
                        to: '-0.8 0.24 1',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move spinneret model right
                const spinneret = document.querySelector('#spinneret-stress');
                if (spinneret) {
                    spinneret.setAttribute('animation__move', {
                        property: 'position',
                        to: '1.7 0.4 1.2',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                // Move filter model left
                const filter = document.querySelector('#Parker_filter_2');
                if (filter) {
                    filter.setAttribute('animation__move', {
                        property: 'position',
                        to: '-0.8 0.35 1',
                        dur: 500,
                        easing: 'easeOutQuad'
                    });
                }
                
                infoPanelVisible = true;
                tapInstruction.textContent = 'TAP TO CLOSE';
                status.textContent = 'Viewing info';
            }
            
            function hideInfo() {
                console.log('📱 Closing info panel...');
                
                // Fade out
                const overlay = infoPanel.querySelector('a-plane[color="#000"]');
                if (overlay) {
                    overlay.setAttribute('animation', {
                        property: 'material.opacity',
                        to: 0,
                        dur: 300
                    });
                }
                
                const bgImage = infoPanel.querySelector('a-image');
                if (bgImage) {
                    bgImage.setAttribute('animation', {
                        property: 'opacity',
                        to: 0,
                        dur: 300
                    });
                }
                
                // Scale out
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    to: '0.7 0.7 0.7',
                    dur: 300
                });
                
                // Move all elements back to original positions
                const simonPhoto = document.querySelector('a-image[src="assets/simon.JPG"]');
                if (simonPhoto) {
                    simonPhoto.setAttribute('animation__move', {
                        property: 'position',
                        to: '1.3 0.25 -.1',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const simonName = document.querySelector('a-image[src="assets/simon-name.png"]');
                if (simonName) {
                    simonName.setAttribute('animation__move', {
                        property: 'position',
                        to: '1.32 0.23 .35',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const video = document.querySelector('a-plane[material*="pfic_ar"]');
                if (video) {
                    video.setAttribute('animation__move', {
                        property: 'position',
                        to: '0 0.25 0',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const parkerLogo = document.querySelector('a-image[src="assets/parker-logo.jpg"]');
                if (parkerLogo) {
                    parkerLogo.setAttribute('animation__move', {
                        property: 'position',
                        to: '-.42 0.23 -.62',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const pficName = document.querySelector('a-image[src="assets/pfic-name.png"]');
                if (pficName) {
                    pficName.setAttribute('animation__move', {
                        property: 'position',
                        to: '1 0.24 -.60',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const parker2 = document.querySelector('a-image[src="assets/parker_2.jpg"]');
                if (parker2) {
                    parker2.setAttribute('animation__move', {
                        property: 'position',
                        to: '-.3 0.24 .75',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const spinneret = document.querySelector('#spinneret-stress');
                if (spinneret) {
                    spinneret.setAttribute('animation__move', {
                        property: 'position',
                        to: '1.3 0.4 .9',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                const filter = document.querySelector('#Parker_filter_2');
                if (filter) {
                    filter.setAttribute('animation__move', {
                        property: 'position',
                        to: '0.6 0.35 .75',
                        dur: 300,
                        easing: 'easeInQuad'
                    });
                }
                
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                
                infoPanelVisible = false;
                tapInstruction.textContent = 'TAP FOR INFO';
                status.textContent = 'AR Active';
            }
            
            // LinkedIn button
            linkedinBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('🔗 LinkedIn button clicked!');
                window.open('https://www.linkedin.com/in/simonpadron/', '_blank');
            });
            
            // Video events
            video.addEventListener('loadeddata', () => {
                console.log('✅ Video loaded');
            });
        </script>
    
    </body>
</html>
