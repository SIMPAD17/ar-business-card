<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            }
            
            /* Minimal status */
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.5);
                font-size: 11px;
                padding: 8px 16px;
                background: rgba(0, 0, 0, 0.4);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                z-index: 1000;
                transition: all 0.3s;
                pointer-events: none;
            }
            
            #status.active {
                color: rgba(255, 255, 255, 0.9);
                background: rgba(0, 0, 0, 0.7);
            }
        </style>
    </head>

    <body>
        <div id="status">Point camera at marker</div>

        <!-- A-Frame AR Scene -->
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video 
                    id="pfic_ar" 
                    crossOrigin="anonymous" 
                    src="assets/PFIC_AR.mp4" 
                    preload="auto"
                    loop="true"
                    playsinline
                    webkit-playsinline
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.7"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 0.9" position="2 4 2"></a-entity>
                <a-entity light="type: point; color: #fff; intensity: 0.4" position="0 2 0"></a-entity>
                
                <!-- Images - Clean hover effect -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.2 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                    class="clickable"
                ></a-image>
                
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.2 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400"
                    animation__float="property: position; to: -.42 0.23 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.2 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600"
                    animation__float="property: position; to: -.3 0.24 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.2 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800"
                    animation__float="property: position; to: 1 0.24 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.2 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000"
                    animation__float="property: position; to: 1.32 0.23 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>
                
                <a-image 
                    src="assets/PFIC_SITE.JPG"
                    width="1.6" 
                    height=".9" 
                    position="0 0.05 0"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 0.9; dur: 800; delay: 100"
                ></a-image>

                <!-- 3D Models - Simple rotation only -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 30000; loop: true; easing: linear; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 25000; loop: true; easing: linear; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- Interactive Menu - Floating in AR (top right, near QR area) -->
                <a-entity id="ar-menu" position="1.2 0.3 -.6">
                    
                    <!-- Menu Button - Info -->
                    <a-box
                        id="info-btn"
                        position="0 0 0"
                        width="0.3"
                        height="0.12"
                        depth="0.02"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 0.95; dur: 600; delay: 1800"
                        animation__float="property: position; to: 0 0.05 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; delay: 2400"
                        class="clickable"
                    >
                        <a-text
                            value="INFO"
                            align="center"
                            color="#000"
                            width="1.2"
                            position="0 0 0.015"
                        ></a-text>
                    </a-box>
                    
                    <!-- Video Control Button -->
                    <a-box
                        id="video-btn"
                        position="0 -0.15 0"
                        width="0.3"
                        height="0.12"
                        depth="0.02"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 0.95; dur: 600; delay: 2000"
                        animation__float="property: position; to: 0 -0.1 0; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine; delay: 2600"
                        class="clickable"
                    >
                        <a-text
                            id="video-btn-text"
                            value="PLAY"
                            align="center"
                            color="#000"
                            width="1.2"
                            position="0 0 0.015"
                        ></a-text>
                    </a-box>
                    
                </a-entity>
                
                <!-- Info Panel - Modern card style -->
                <a-entity
                    id="info-panel"
                    position="0 0.6 -0.5"
                    visible="false"
                >
                    <!-- Panel background -->
                    <a-plane
                        width="2.2"
                        height="1.8"
                        color="#000"
                        opacity="0"
                        material="transparent: true; opacity: 0.95"
                    >
                        <!-- Border accent -->
                        <a-plane
                            width="2.25"
                            height="1.85"
                            color="#fff"
                            opacity="0.2"
                            position="0 0 -0.01"
                        ></a-plane>
                    </a-plane>
                    
                    <!-- Content -->
                    <a-text
                        value="SIMON PADRON"
                        align="center"
                        color="#fff"
                        width="2"
                        position="0 0.7 0.01"
                        font="roboto"
                    ></a-text>
                    
                    <a-text
                        value="Filtration Engineer\nParker Hannifin PFIC"
                        align="center"
                        color="#ccc"
                        width="1.8"
                        position="0 0.5 0.01"
                        line-height="50"
                    ></a-text>
                    
                    <a-text
                        value="Ph.D. Student | Membrane Science\nSpecializing in:\n• Nanofiber Production\n• CFD/FEA Simulation\n• VR Visualization\n• Advanced Analytics"
                        align="center"
                        color="#fff"
                        width="1.9"
                        position="0 0.1 0.01"
                        line-height="50"
                    ></a-text>
                    
                    <!-- LinkedIn Button -->
                    <a-box
                        id="linkedin-btn"
                        position="0 -0.6 0.01"
                        width="0.8"
                        height="0.15"
                        depth="0.02"
                        color="#0077B5"
                        class="clickable"
                    >
                        <a-text
                            value="LINKEDIN"
                            align="center"
                            color="#fff"
                            width="2.5"
                            position="0 0 0.015"
                        ></a-text>
                    </a-box>
                    
                    <!-- Close button -->
                    <a-box
                        id="close-btn"
                        position="0.95 0.8 0.01"
                        width="0.15"
                        height="0.15"
                        depth="0.02"
                        color="#fff"
                        opacity="0.9"
                        class="clickable"
                    >
                        <a-text
                            value="X"
                            align="center"
                            color="#000"
                            width="2"
                            position="0 0 0.015"
                        ></a-text>
                    </a-box>
                </a-entity>
                
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const status = document.getElementById('status');
            const scene = document.querySelector('a-scene');
            const infoPanel = document.querySelector('#info-panel');
            const videoBtnText = document.querySelector('#video-btn-text');
            
            let markerVisible = false;
            let videoPlaying = false;
            let infoPanelVisible = false;
            
            // Marker detection
            marker.addEventListener('markerFound', () => {
                console.log('Marker detected');
                markerVisible = true;
                status.textContent = 'AR Active';
                status.classList.add('active');
                
                // Try to autoplay video (may fail on some browsers)
                setTimeout(() => {
                    if (video && !videoPlaying) {
                        video.play().then(() => {
                            videoPlaying = true;
                            videoBtnText.setAttribute('value', 'PAUSE');
                            console.log('Video autoplayed');
                        }).catch(e => {
                            console.log('Autoplay prevented - user must click play');
                            videoPlaying = false;
                            videoBtnText.setAttribute('value', 'PLAY');
                        });
                    }
                }, 1000);
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('Marker lost');
                markerVisible = false;
                status.textContent = 'Point camera at marker';
                status.classList.remove('active');
                
                // Hide info panel
                if (infoPanelVisible) {
                    hideInfoPanel();
                }
            });
            
            // Info button click
            document.querySelector('#info-btn').addEventListener('click', () => {
                console.log('Info button clicked');
                if (!infoPanelVisible) {
                    showInfoPanel();
                } else {
                    hideInfoPanel();
                }
            });
            
            function showInfoPanel() {
                infoPanel.setAttribute('visible', true);
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    from: '0.1 0.1 0.1',
                    to: '1 1 1',
                    dur: 400,
                    easing: 'easeOutBack'
                });
                infoPanelVisible = true;
            }
            
            function hideInfoPanel() {
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    to: '0.1 0.1 0.1',
                    dur: 300,
                    easing: 'easeInQuad'
                });
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                infoPanelVisible = false;
            }
            
            // Close button
            document.querySelector('#close-btn').addEventListener('click', () => {
                console.log('Close button clicked');
                hideInfoPanel();
            });
            
            // LinkedIn button - Opens in new tab
            document.querySelector('#linkedin-btn').addEventListener('click', () => {
                console.log('LinkedIn button clicked');
                window.open('https://www.linkedin.com/in/simonpadron/', '_blank');
            });
            
            // Video button click
            document.querySelector('#video-btn').addEventListener('click', () => {
                console.log('Video button clicked');
                if (!videoPlaying) {
                    video.play().then(() => {
                        videoPlaying = true;
                        videoBtnText.setAttribute('value', 'PAUSE');
                        console.log('Video playing');
                    }).catch(e => {
                        console.log('Video play error:', e);
                    });
                } else {
                    video.pause();
                    videoPlaying = false;
                    videoBtnText.setAttribute('value', 'PLAY');
                    console.log('Video paused');
                }
            });
            
            // Enable video on first touch (mobile)
            let touchEnabled = false;
            document.addEventListener('touchstart', () => {
                if (!touchEnabled && markerVisible) {
                    touchEnabled = true;
                    if (video && !videoPlaying) {
                        video.play().then(() => {
                            videoPlaying = true;
                            videoBtnText.setAttribute('value', 'PAUSE');
                        }).catch(e => console.log('Touch play error:', e));
                    }
                }
            }, { once: false });
            
            // Click anywhere to enable video
            let clickEnabled = false;
            document.addEventListener('click', (e) => {
                // Don't trigger on button clicks
                if (!e.target.closest('.clickable') && !clickEnabled && markerVisible) {
                    clickEnabled = true;
                    if (video && !videoPlaying) {
                        video.play().then(() => {
                            videoPlaying = true;
                            videoBtnText.setAttribute('value', 'PAUSE');
                        }).catch(e => console.log('Click play error:', e));
                    }
                }
            });
            
            // Debug: Check if video is loaded
            video.addEventListener('loadeddata', () => {
                console.log('Video loaded successfully');
            });
            
            video.addEventListener('error', (e) => {
                console.error('Video error:', e);
            });
            
            // Log when scene is ready
            scene.addEventListener('loaded', () => {
                console.log('AR Scene loaded');
            });
        </script>
    
    </body>
</html>
