<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
            
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.9);
                font-size: 13px;
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.8);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                z-index: 1000;
                pointer-events: none;
            }
            
            /* Tap to play prompt */
            #play-prompt {
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                color: #fff;
                font-size: 16px;
                padding: 15px 30px;
                background: rgba(0, 0, 0, 0.9);
                border-radius: 30px;
                border: 2px solid #fff;
                z-index: 1001;
                animation: pulse 2s infinite;
                cursor: pointer;
            }
            
            #play-prompt.hidden {
                display: none;
            }
            
            @keyframes pulse {
                0%, 100% { transform: translateX(-50%) scale(1); }
                50% { transform: translateX(-50%) scale(1.05); }
            }
        </style>
    </head>

    <body>
        <div id="status">AR Active - Look for menu above card</div>
        <div id="play-prompt">TAP TO START VIDEO</div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video 
                    id="pfic_ar" 
                    crossOrigin="anonymous" 
                    src="assets/PFIC_AR.mp4" 
                    preload="auto"
                    loop="true"
                    playsinline
                    webkit-playsinline
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.8"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 1" position="2 4 2"></a-entity>
                <a-entity light="type: point; color: #fff; intensity: 0.5" position="0 3 0"></a-entity>
                
                <!-- Images -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.2 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                ></a-image>
                
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.2 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400"
                    animation__float="property: position; to: -.42 0.23 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.2 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600"
                    animation__float="property: position; to: -.3 0.24 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.2 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800"
                    animation__float="property: position; to: 1 0.24 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.2 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000"
                    animation__float="property: position; to: 1.32 0.23 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>
                
                <a-image 
                    src="assets/PFIC_SITE.JPG"
                    width="1.6" 
                    height=".9" 
                    position="0 0.05 0"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 0.9; dur: 800; delay: 100"
                ></a-image>

                <!-- 3D Models - Simple rotation -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 30000; loop: true; easing: linear; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 25000; loop: true; easing: linear; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- LARGE Interactive Menu - High above card, very visible -->
                <a-entity id="ar-menu" position="0 0.8 -0.4">
                    
                    <!-- Video Control - Large and visible -->
                    <a-box
                        id="video-btn"
                        position="-0.35 0 0"
                        width="0.6"
                        height="0.2"
                        depth="0.05"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 1; dur: 800; delay: 2000"
                        animation__pulse="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine; delay: 2800"
                        class="clickable"
                    >
                        <a-text
                            id="video-btn-text"
                            value="▶ PLAY VIDEO"
                            align="center"
                            color="#000"
                            width="2.5"
                            position="0 0 0.03"
                        ></a-text>
                    </a-box>
                    
                    <!-- Info Button - Large and visible -->
                    <a-box
                        id="info-btn"
                        position="0.35 0 0"
                        width="0.6"
                        height="0.2"
                        depth="0.05"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 1; dur: 800; delay: 2200"
                        animation__pulse="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1700; loop: true; easing: easeInOutSine; delay: 3000"
                        class="clickable"
                    >
                        <a-text
                            value="ℹ INFO"
                            align="center"
                            color="#000"
                            width="2.5"
                            position="0 0 0.03"
                        ></a-text>
                    </a-box>
                    
                    <!-- Pointer arrow to menu -->
                    <a-cone
                        position="0 -0.15 0"
                        radius-bottom="0.08"
                        radius-top="0"
                        height="0.15"
                        color="#fff"
                        opacity="0"
                        animation="property: opacity; to: 0.8; dur: 600; delay: 2400"
                        animation__bob="property: position; to: 0 -0.2 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine; delay: 3000"
                    ></a-cone>
                    
                </a-entity>
                
                <!-- Info Panel - Modern card -->
                <a-entity
                    id="info-panel"
                    position="0 0.8 -0.3"
                    visible="false"
                >
                    <!-- Panel background -->
                    <a-plane
                        width="2.5"
                        height="2"
                        color="#000"
                        opacity="0.95"
                    >
                        <!-- Border -->
                        <a-plane
                            width="2.55"
                            height="2.05"
                            color="#fff"
                            opacity="0.3"
                            position="0 0 -0.01"
                        ></a-plane>
                    </a-plane>
                    
                    <!-- Content -->
                    <a-text
                        value="SIMON PADRON"
                        align="center"
                        color="#fff"
                        width="2.2"
                        position="0 0.8 0.01"
                    ></a-text>
                    
                    <a-text
                        value="Filtration Engineer\nParker Hannifin PFIC"
                        align="center"
                        color="#ccc"
                        width="2"
                        position="0 0.55 0.01"
                        line-height="50"
                    ></a-text>
                    
                    <a-text
                        value="Ph.D. Student | Membrane Science\n\nSpecializations:\n• Nanofiber Production\n• CFD/FEA Simulation\n• VR Visualization\n• Advanced Analytics"
                        align="center"
                        color="#fff"
                        width="2.1"
                        position="0 0.1 0.01"
                        line-height="48"
                    ></a-text>
                    
                    <!-- LinkedIn Button - Larger -->
                    <a-box
                        id="linkedin-btn"
                        position="0 -0.65 0.01"
                        width="1.2"
                        height="0.22"
                        depth="0.04"
                        color="#0077B5"
                        class="clickable"
                        animation__pulse="property: scale; to: 1.05 1.05 1.05; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
                    >
                        <a-text
                            value="🔗 LINKEDIN"
                            align="center"
                            color="#fff"
                            width="3"
                            position="0 0 0.025"
                        ></a-text>
                    </a-box>
                    
                    <!-- Close button - Larger -->
                    <a-box
                        id="close-btn"
                        position="1.1 0.85 0.01"
                        width="0.2"
                        height="0.2"
                        depth="0.04"
                        color="#fff"
                        class="clickable"
                    >
                        <a-text
                            value="✕"
                            align="center"
                            color="#000"
                            width="2"
                            position="0 0 0.025"
                        ></a-text>
                    </a-box>
                </a-entity>
                
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const status = document.getElementById('status');
            const playPrompt = document.getElementById('play-prompt');
            const infoPanel = document.querySelector('#info-panel');
            const videoBtnText = document.querySelector('#video-btn-text');
            
            let videoPlaying = false;
            let infoPanelVisible = false;
            let userInteracted = false;
            
            // Marker detection
            marker.addEventListener('markerFound', () => {
                console.log('✅ Marker detected!');
                status.textContent = 'AR Active - Tap buttons above card';
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('❌ Marker lost');
                status.textContent = 'Point camera at marker';
                if (infoPanelVisible) {
                    hideInfoPanel();
                }
            });
            
            // Play prompt click
            playPrompt.addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('Play prompt clicked');
                startVideo();
            });
            
            function startVideo() {
                if (video && !videoPlaying) {
                    // Try with sound first
                    video.muted = false;
                    video.play().then(() => {
                        videoPlaying = true;
                        videoBtnText.setAttribute('value', '⏸ PAUSE');
                        playPrompt.classList.add('hidden');
                        userInteracted = true;
                        console.log('✅ Video playing with sound');
                    }).catch(e => {
                        // If that fails, try muted
                        console.log('Trying muted playback...');
                        video.muted = true;
                        video.play().then(() => {
                            videoPlaying = true;
                            videoBtnText.setAttribute('value', '⏸ PAUSE');
                            playPrompt.classList.add('hidden');
                            userInteracted = true;
                            console.log('✅ Video playing muted');
                        }).catch(e2 => {
                            console.error('❌ Video play failed:', e2);
                        });
                    });
                }
            }
            
            // Video button click
            document.querySelector('#video-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('Video button clicked');
                
                if (!videoPlaying) {
                    startVideo();
                } else {
                    video.pause();
                    videoPlaying = false;
                    videoBtnText.setAttribute('value', '▶ PLAY VIDEO');
                    console.log('Video paused');
                }
            });
            
            // Info button click
            document.querySelector('#info-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('Info button clicked');
                if (!infoPanelVisible) {
                    showInfoPanel();
                } else {
                    hideInfoPanel();
                }
            });
            
            function showInfoPanel() {
                infoPanel.setAttribute('visible', true);
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    from: '0.1 0.1 0.1',
                    to: '1 1 1',
                    dur: 400,
                    easing: 'easeOutBack'
                });
                infoPanelVisible = true;
            }
            
            function hideInfoPanel() {
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    to: '0.1 0.1 0.1',
                    dur: 300,
                    easing: 'easeInQuad'
                });
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                infoPanelVisible = false;
            }
            
            // Close button
            document.querySelector('#close-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('Close button clicked');
                hideInfoPanel();
            });
            
            // LinkedIn button
            document.querySelector('#linkedin-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('LinkedIn button clicked');
                window.open('https://www.linkedin.com/in/simonpadron/', '_blank');
            });
            
            // Tap anywhere to start video
            document.addEventListener('touchstart', (e) => {
                if (!userInteracted && !e.target.closest('.clickable')) {
                    console.log('Screen tapped');
                    startVideo();
                }
            }, { once: false });
            
            // Video loading events
            video.addEventListener('loadeddata', () => {
                console.log('✅ Video loaded');
            });
            
            video.addEventListener('error', (e) => {
                console.error('❌ Video error:', e);
                console.error('Video src:', video.src);
            });
            
            video.addEventListener('play', () => {
                console.log('🎬 Video playing');
            });
            
            video.addEventListener('pause', () => {
                console.log('⏸ Video paused');
            });
        </script>
    
    </body>
</html>
