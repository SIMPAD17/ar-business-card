<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            }
            
            /* Minimal loading indicator */
            #loading {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #fff;
                font-size: 14px;
                z-index: 9999;
                text-align: center;
                pointer-events: none;
                transition: opacity 0.5s;
            }
            
            #loading.hidden {
                opacity: 0;
            }
            
            .dot {
                width: 8px;
                height: 8px;
                background: #fff;
                border-radius: 50%;
                display: inline-block;
                margin: 0 3px;
                animation: pulse 1.4s infinite ease-in-out;
            }
            
            .dot:nth-child(1) { animation-delay: -0.32s; }
            .dot:nth-child(2) { animation-delay: -0.16s; }
            
            @keyframes pulse {
                0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
                40% { opacity: 1; transform: scale(1); }
            }
            
            /* Minimal status indicator */
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.6);
                font-size: 12px;
                padding: 8px 16px;
                background: rgba(0, 0, 0, 0.6);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                z-index: 1000;
                transition: all 0.3s;
            }
            
            #status.detected {
                color: rgba(255, 255, 255, 0.9);
                background: rgba(0, 0, 0, 0.8);
            }
            
            /* Hidden by default */
            .a-loader-title {
                display: none !important;
            }
        </style>
    </head>

    <body>
        <!-- Minimal Loading -->
        <div id="loading">
            <div>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        
        <!-- Minimal Status -->
        <div id="status">Point at marker</div>

        <!-- A-Frame AR Scene -->
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; precision: medium;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video id="pfic_ar" crossOrigin="anonymous" type="video/mp4" src="assets/PFIC_AR.mp4" autoplay loop="true" muted="true" webkit-playsinline playsinline></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting - Minimal, dramatic -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.6"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 0.8" position="2 4 2"></a-entity>
                <a-entity light="type: point; color: #fff; intensity: 0.5" position="0 2 0"></a-entity>
                
                <!-- Base plane (semi-transparent) -->
                <a-plane
                    position="0 0.01 0"
                    rotation="-90 0 0"
                    width="3.5"
                    height="2.5"
                    color="#000"
                    opacity="0.15"
                    material="transparent: true"
                ></a-plane>
                
                <!-- Minimalist corner markers -->
                <a-box position="-1.5 0.02 -1" scale="0.08 0.01 0.08" color="#fff" opacity="0.8"></a-box>
                <a-box position="1.5 0.02 -1" scale="0.08 0.01 0.08" color="#fff" opacity="0.8"></a-box>
                <a-box position="-1.5 0.02 1" scale="0.08 0.01 0.08" color="#fff" opacity="0.8"></a-box>
                <a-box position="1.5 0.02 1" scale="0.08 0.01 0.08" color="#fff" opacity="0.8"></a-box>
                
                <!-- Images - Subtle elevation with shadows -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.15 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200; easing: easeOutQuad"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                    class="clickable"
                ></a-image>
                
                <!-- Glow underneath photo -->
                <a-circle
                    position="1.3 0.02 -.1"
                    rotation="-90 0 0"
                    radius="0.4"
                    color="#fff"
                    opacity="0"
                    animation="property: opacity; to: 0.2; dur: 600; delay: 200"
                    animation__pulse="property: opacity; to: 0.35; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; delay: 800"
                ></a-circle>
                
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.15 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400; easing: easeOutQuad"
                    animation__float="property: position; to: -.42 0.2 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.15 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600; easing: easeOutQuad"
                    animation__float="property: position; to: -.3 0.2 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.15 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800; easing: easeOutQuad"
                    animation__float="property: position; to: 1 0.22 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.15 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000; easing: easeOutQuad"
                    animation__float="property: position; to: 1.32 0.2 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>
                
                <a-image 
                    src="assets/PFIC_SITE.JPG"
                    width="1.6" 
                    height=".9" 
                    position="0 0.05 0"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 0.9; dur: 800; delay: 100; easing: easeOutQuad"
                ></a-image>

                <!-- 3D Models - Elevated and dramatic -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="-60 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: -60 360 0; dur: 20000; loop: true; easing: linear; delay: 2400"
                    animation__float="property: position; to: 1.3 0.5 .9; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- Minimal glow ring -->
                <a-ring
                    position="1.3 0.03 .9"
                    rotation="-90 0 0"
                    radius-inner="0.25"
                    radius-outer="0.3"
                    color="#fff"
                    opacity="0"
                    animation="property: opacity; to: 0.3; dur: 600; delay: 1200"
                    animation__pulse="property: radius-outer; to: 0.35; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; delay: 2400"
                    animation__fade="property: opacity; to: 0.5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; delay: 2400"
                ></a-ring>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="45 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 45 360 0; dur: 15000; loop: true; easing: linear; delay: 2600"
                    animation__float="property: position; to: 0.6 0.45 .75; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- Minimal glow ring -->
                <a-ring
                    position="0.6 0.03 .75"
                    rotation="-90 0 0"
                    radius-inner="0.35"
                    radius-outer="0.4"
                    color="#fff"
                    opacity="0"
                    animation="property: opacity; to: 0.3; dur: 600; delay: 1400"
                    animation__pulse="property: radius-outer; to: 0.45; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine; delay: 2600"
                    animation__fade="property: opacity; to: 0.5; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine; delay: 2600"
                ></a-ring>
                
                <!-- AR Buttons - Floating above QR code area (top right) -->
                <!-- Video Control Button -->
                <a-plane
                    id="video-btn"
                    position="1.3 0.3 -.5"
                    rotation="-90 0 0"
                    width="0.25"
                    height="0.25"
                    color="#fff"
                    opacity="0"
                    animation="property: opacity; to: 0.8; dur: 600; delay: 1800; easing: easeOutQuad"
                    animation__float="property: position; to: 1.3 0.35 -.5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine; delay: 2400"
                    class="clickable"
                >
                    <!-- Play/Pause Icon -->
                    <a-text
                        value="▶"
                        align="center"
                        color="#000"
                        width="1.5"
                        position="0 0 0.01"
                    ></a-text>
                </a-plane>
                
                <!-- Info Button -->
                <a-plane
                    id="info-btn"
                    position="0.95 0.3 -.5"
                    rotation="-90 0 0"
                    width="0.25"
                    height="0.25"
                    color="#fff"
                    opacity="0"
                    animation="property: opacity; to: 0.8; dur: 600; delay: 2000; easing: easeOutQuad"
                    animation__float="property: position; to: 0.95 0.35 -.5; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine; delay: 2600"
                    class="clickable"
                >
                    <a-text
                        value="i"
                        align="center"
                        color="#000"
                        width="2"
                        position="0 0 0.01"
                    ></a-text>
                </a-plane>
                
                <!-- Info Panel - Appears in AR when info button clicked -->
                <a-plane
                    id="info-panel"
                    position="0 0.5 -0.8"
                    width="2.5"
                    height="1.5"
                    color="#000"
                    opacity="0"
                    visible="false"
                    material="transparent: true; opacity: 0.95"
                >
                    <a-text
                        value="SIMON\nFiltration Engineer\nParker Hannifin PFIC\n\nSpecializations:\n• Nanofiber Production\n• CFD/FEA Simulation\n• VR Visualization\n• Advanced Analytics\n\nPh.D. Student\nMembrane Science"
                        align="center"
                        color="#fff"
                        width="2.2"
                        position="0 0.1 0.01"
                        line-height="55"
                    ></a-text>
                    
                    <!-- Close button -->
                    <a-circle
                        id="close-btn"
                        position="1 0.6 0.01"
                        radius="0.08"
                        color="#fff"
                        opacity="0.9"
                        class="clickable"
                    >
                        <a-text
                            value="×"
                            align="center"
                            color="#000"
                            width="1"
                            position="0 0 0.01"
                        ></a-text>
                    </a-circle>
                </a-plane>
                
                <!-- Floating particles - Minimal -->
                <a-entity id="particles">
                    <a-sphere
                        position="1.2 0.6 0"
                        radius="0.02"
                        color="#fff"
                        opacity="0.6"
                        animation="property: position; to: 1.2 0.8 0; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine"
                    ></a-sphere>
                    <a-sphere
                        position="-0.8 0.6 0.5"
                        radius="0.02"
                        color="#fff"
                        opacity="0.5"
                        animation="property: position; to: -0.8 0.75 0.5; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine"
                    ></a-sphere>
                    <a-sphere
                        position="0 0.7 -0.8"
                        radius="0.015"
                        color="#fff"
                        opacity="0.4"
                        animation="property: position; to: 0 0.9 -0.8; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine"
                    ></a-sphere>
                </a-entity>
                
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const scene = document.querySelector('a-scene');
            const infoPanel = document.querySelector('#info-panel');
            let videoPlaying = false;
            let infoPanelVisible = false;
            
            // Hide loading after scene loads
            scene.addEventListener('loaded', () => {
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 1000);
            });
            
            // Marker detection
            marker.addEventListener('markerFound', () => {
                console.log('Marker detected');
                status.textContent = 'AR Active';
                status.classList.add('detected');
                
                // Auto-play video
                if (video && video.paused) {
                    video.play().catch(e => console.log('Video autoplay prevented'));
                    videoPlaying = true;
                }
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('Marker lost');
                status.textContent = 'Point at marker';
                status.classList.remove('detected');
                
                // Hide info panel if visible
                if (infoPanelVisible) {
                    infoPanel.setAttribute('visible', false);
                    infoPanel.setAttribute('animation', 'property: opacity; to: 0; dur: 300');
                    infoPanelVisible = false;
                }
            });
            
            // Video button click
            document.querySelector('#video-btn').addEventListener('click', () => {
                const btn = document.querySelector('#video-btn a-text');
                if (video.paused) {
                    video.play();
                    btn.setAttribute('value', '⏸');
                    videoPlaying = true;
                } else {
                    video.pause();
                    btn.setAttribute('value', '▶');
                    videoPlaying = false;
                }
            });
            
            // Info button click
            document.querySelector('#info-btn').addEventListener('click', () => {
                if (!infoPanelVisible) {
                    infoPanel.setAttribute('visible', true);
                    infoPanel.setAttribute('animation', 'property: opacity; to: 0.95; dur: 400; easing: easeOutQuad');
                    infoPanelVisible = true;
                } else {
                    infoPanel.setAttribute('animation', 'property: opacity; to: 0; dur: 300');
                    setTimeout(() => {
                        infoPanel.setAttribute('visible', false);
                    }, 300);
                    infoPanelVisible = false;
                }
            });
            
            // Close button
            document.querySelector('#close-btn').addEventListener('click', () => {
                infoPanel.setAttribute('animation', 'property: opacity; to: 0; dur: 300');
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                infoPanelVisible = false;
            });
            
            // Enable video on touch (mobile requirement)
            document.body.addEventListener('touchstart', () => {
                if (video && video.paused) {
                    video.play().catch(e => console.log('Video play error:', e));
                }
            }, { once: true });
            
            // Click anywhere to play video
            document.body.addEventListener('click', () => {
                if (video && video.paused) {
                    video.play().catch(e => console.log('Video play error:', e));
                }
            }, { once: true });
        </script>
    
    </body>
</html>
