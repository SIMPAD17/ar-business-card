<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Simon's AR Card</title>
        
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }
            
            #status {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 255, 255, 0.9);
                font-size: 14px;
                padding: 12px 24px;
                background: rgba(0, 0, 0, 0.8);
                border-radius: 25px;
                border: 1px solid rgba(255,255,255,0.3);
                z-index: 1000;
                pointer-events: none;
            }
        </style>
    </head>

    <body>
        <div id="status">Point at marker</div>

        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false"
            arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
            renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
            embedded
            gesture-detector
        >
            <a-assets>
                <video 
                    id="pfic_ar" 
                    crossOrigin="anonymous" 
                    src="assets/PFIC_AR.mp4" 
                    preload="auto"
                    loop="true"
                    playsinline
                    webkit-playsinline
                    muted
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse"
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
            >
                <!-- Lighting -->
                <a-entity light="type: ambient; color: #fff; intensity: 0.9"></a-entity>
                <a-entity light="type: directional; color: #fff; intensity: 1" position="2 4 2"></a-entity>
                
                <!-- VIDEO PLANE -->
                <a-plane
                    position="0 0.6 0"
                    rotation="-45 0 0"
                    width="1.8"
                    height="1"
                    material="src: #pfic_ar; shader: flat; side: double"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 800; delay: 500"
                    animation__float="property: position; to: 0 0.65 0; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1300"
                ></a-plane>
                
                <!-- Ground image -->
                <a-image 
                    src="assets/PFIC_SITE.JPG"
                    width="1.6" 
                    height=".9" 
                    position="0 0.05 0"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 0.8; dur: 800; delay: 100"
                ></a-image>
                
                <!-- Your Photo -->
                <a-image 
                    src="assets/simon.JPG"
                    position="1.3 0.2 -.1"
                    scale="0.70 0.70 0.70"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 200"
                    animation__float="property: position; to: 1.3 0.25 -.1; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 800"
                ></a-image>
                
                <!-- CLICKABLE INFO BUTTON - Flat on card like images -->
                <a-cylinder
                    id="info-btn"
                    position="1.7 0.35 -.1"
                    rotation="-90 0 0"
                    radius="0.18"
                    height="0.02"
                    color="#fff"
                    opacity="0"
                    animation="property: opacity; to: 0.95; dur: 600; delay: 2000"
                    animation__pulse="property: scale; to: 1.3 1 1.3; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine; delay: 2600"
                    class="clickable"
                    event-set__enter="_event: mouseenter; scale: 1.4 1 1.4"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                >
                    <!-- Info icon text -->
                    <a-text
                        value="ℹ"
                        align="center"
                        color="#000"
                        width="1"
                        position="0 0.015 0"
                        wrap-count="1"
                    ></a-text>
                    
                    <!-- Pulsing outer ring -->
                    <a-ring
                        position="0 -0.005 0"
                        radius-inner="0.2"
                        radius-outer="0.24"
                        color="#fff"
                        opacity="0.4"
                        animation__pulse="property: scale; to: 1.5 1 1.5; loop: true; dur: 1500; easing: easeInOutSine"
                        animation__fade="property: opacity; from: 0.4; to: 0; loop: true; dur: 1500; easing: easeInOutSine"
                    ></a-ring>
                </a-cylinder>
                
                <!-- TAP text -->
                <a-text
                    value="TAP"
                    align="center"
                    color="#fff"
                    width="0.5"
                    position="1.7 0.15 -.1"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 2200"
                    animation__pulse="property: scale; to: 1.15 1 1.15; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine; delay: 2800"
                ></a-text>
                
                <!-- Other Images -->
                <a-image 
                    src="assets/parker-logo.jpg"
                    position="-.42 0.2 -.62"
                    scale="0.75 0.25 0.25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 400"
                    animation__float="property: position; to: -.42 0.23 -.62; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine; delay: 1000"
                ></a-image>
        
                <a-image 
                    src="assets/parker_2.jpg"
                    position="-.3 0.2 .75"
                    scale="1 .5 .5"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 600"
                    animation__float="property: position; to: -.3 0.24 .75; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine; delay: 1200"
                ></a-image>
                
                <a-image 
                    src="assets/pfic-name.png"
                    position="1 0.2 -.60"
                    scale="2 .25 .25"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 800"
                    animation__float="property: position; to: 1 0.24 -.60; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine; delay: 1400"
                ></a-image>
        
                <a-image 
                    src="assets/simon-name.png"
                    position="1.32 0.2 .35"
                    scale=".75 .18 .18"
                    rotation="-90 0 0"
                    opacity="0"
                    animation="property: opacity; to: 1; dur: 600; delay: 1000"
                    animation__float="property: position; to: 1.32 0.23 .35; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine; delay: 1600"
                ></a-image>

                <!-- 3D Models -->
                <a-entity
                    id="spinneret-stress"
                    position="1.3 0 .9"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/spinneret-stress.glb)"
                    animation__rise="property: position; to: 1.3 0.4 .9; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.25 0.25 0.25; dur: 1200; delay: 1200; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 30000; loop: true; easing: linear; delay: 2400"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            
                <a-entity
                    id="Parker_filter_2"
                    position="0.6 0 .75"
                    scale="0.001 0.001 0.001"
                    rotation="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="url(assets/Parker_filter_2.glb)"
                    animation__rise="property: position; to: 0.6 0.35 .75; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__scale="property: scale; to: 0.85 0.85 0.85; dur: 1200; delay: 1400; easing: easeOutBack"
                    animation__rotate="property: rotation; to: 0 360 0; dur: 25000; loop: true; easing: linear; delay: 2600"
                    class="clickable"
                    gesture-handler
                ></a-entity>
                
                <!-- INFO PANEL - Faces camera -->
                <a-entity
                    id="info-panel"
                    position="0 0.8 -0.3"
                    rotation="0 0 0"
                    visible="false"
                >
                    <!-- Background -->
                    <a-plane
                        width="3"
                        height="2.5"
                        color="#000"
                        opacity="0"
                        material="transparent: true; opacity: 0.92"
                    >
                        <!-- Border -->
                        <a-plane
                            width="3.06"
                            height="2.56"
                            color="#fff"
                            opacity="0.2"
                            position="0 0 -0.01"
                        ></a-plane>
                        
                        <!-- Top line -->
                        <a-plane
                            width="3"
                            height="0.01"
                            color="#fff"
                            opacity="0.5"
                            position="0 1.245 0.01"
                        ></a-plane>
                    </a-plane>
                    
                    <!-- Content -->
                    <a-entity position="0 0 0.02">
                        <a-text
                            value="SIMON PADRON"
                            align="center"
                            color="#fff"
                            width="2.6"
                            position="0 1 0"
                            letter-spacing="2"
                        ></a-text>
                        
                        <a-text
                            value="Filtration Engineer\nParker Hannifin PFIC"
                            align="center"
                            color="#ccc"
                            width="2.1"
                            position="0 0.6 0"
                            line-height="48"
                        ></a-text>
                        
                        <a-plane
                            width="2.5"
                            height="0.005"
                            color="#fff"
                            opacity="0.2"
                            position="0 0.35 0"
                        ></a-plane>
                        
                        <a-text
                            value="Ph.D. Student | Membrane Science"
                            align="center"
                            color="#fff"
                            width="2.2"
                            position="0 0.1 0"
                        ></a-text>
                        
                        <a-text
                            value="Hollow Fiber Polyimide Membranes\nfor Gas Separation"
                            align="center"
                            color="#bbb"
                            width="2.3"
                            position="0 -0.15 0"
                            line-height="45"
                        ></a-text>
                        
                        <a-text
                            value="Specializations"
                            align="center"
                            color="#fff"
                            width="1.9"
                            position="0 -0.48 0"
                        ></a-text>
                        
                        <a-text
                            value="Nanofiber Production • CFD/FEA Simulation\nVR Visualization • Advanced Analytics"
                            align="center"
                            color="#aaa"
                            width="2.5"
                            position="0 -0.73 0"
                            line-height="45"
                        ></a-text>
                    </a-entity>
                    
                    <!-- LinkedIn Button - Rounded rectangle facing camera -->
                    <a-plane
                        id="linkedin-btn"
                        position="0 -1.05 0.02"
                        width="1.8"
                        height="0.35"
                        color="#0077B5"
                        opacity="1"
                        class="clickable"
                        event-set__enter="_event: mouseenter; scale: 1.08 1.08 1"
                        event-set__leave="_event: mouseleave; scale: 1 1 1"
                    >
                        <!-- Glow -->
                        <a-plane
                            position="0 0 -0.005"
                            width="1.85"
                            height="0.4"
                            color="#0077B5"
                            opacity="0.3"
                        ></a-plane>
                        
                        <a-text
                            value="CONNECT ON LINKEDIN"
                            align="center"
                            color="#fff"
                            width="4.5"
                            position="0 0 0.01"
                            letter-spacing="1"
                        ></a-text>
                    </a-plane>
                    
                    <!-- Close Button - Circle facing camera -->
                    <a-circle
                        id="close-btn"
                        position="1.35 1.1 0.02"
                        radius="0.18"
                        color="#fff"
                        opacity="0.95"
                        class="clickable"
                        event-set__enter="_event: mouseenter; scale: 1.15 1.15 1"
                        event-set__leave="_event: mouseleave; scale: 1 1 1"
                    >
                        <a-text
                            value="✕"
                            align="center"
                            color="#000"
                            width="1.3"
                            position="0 0 0.01"
                        ></a-text>
                    </a-circle>
                </a-entity>
                
            </a-marker>

            <!-- Camera with cursor -->
            <a-entity camera>
                <a-entity 
                    cursor="fuse: false; rayOrigin: mouse"
                    raycaster="objects: .clickable; far: 20"
                ></a-entity>
            </a-entity>
        </a-scene>
    
        <script>
            const video = document.querySelector('#pfic_ar');
            const marker = document.querySelector('a-marker');
            const status = document.getElementById('status');
            const infoBtn = document.querySelector('#info-btn');
            const infoPanel = document.querySelector('#info-panel');
            const closeBtn = document.querySelector('#close-btn');
            const linkedinBtn = document.querySelector('#linkedin-btn');
            
            let infoPanelVisible = false;
            
            // Marker events
            marker.addEventListener('markerFound', () => {
                console.log('✅ Marker detected!');
                status.textContent = 'AR Active - Tap ⓘ for info';
                
                // Auto-start video
                setTimeout(() => {
                    video.play().then(() => {
                        console.log('✅ Video playing');
                    }).catch(e => console.log('Video autoplay prevented'));
                }, 1000);
            });
            
            marker.addEventListener('markerLost', () => {
                console.log('❌ Marker lost');
                status.textContent = 'Point at marker';
                if (infoPanelVisible) {
                    hideInfo();
                }
            });
            
            // Info button clicks
            infoBtn.addEventListener('click', (e) => {
                console.log('🔵 Info button clicked!');
                showInfo();
            });
            
            function showInfo() {
                console.log('📱 Opening info panel...');
                infoPanel.setAttribute('visible', true);
                
                const panel = infoPanel.querySelector('a-plane');
                panel.setAttribute('animation', {
                    property: 'material.opacity',
                    from: 0,
                    to: 0.92,
                    dur: 500,
                    easing: 'easeOutQuad'
                });
                
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    from: '0.7 0.7 0.7',
                    to: '1 1 1',
                    dur: 500,
                    easing: 'easeOutBack'
                });
                
                infoPanelVisible = true;
                status.textContent = 'Viewing info';
            }
            
            function hideInfo() {
                console.log('📱 Closing info panel...');
                
                const panel = infoPanel.querySelector('a-plane');
                panel.setAttribute('animation', {
                    property: 'material.opacity',
                    to: 0,
                    dur: 300
                });
                
                infoPanel.setAttribute('animation', {
                    property: 'scale',
                    to: '0.7 0.7 0.7',
                    dur: 300
                });
                
                setTimeout(() => {
                    infoPanel.setAttribute('visible', false);
                }, 300);
                
                infoPanelVisible = false;
                status.textContent = 'AR Active - Tap ⓘ for info';
            }
            
            // Close button
            closeBtn.addEventListener('click', (e) => {
                console.log('❌ Close button clicked!');
                hideInfo();
            });
            
            // LinkedIn button
            linkedinBtn.addEventListener('click', (e) => {
                console.log('🔗 LinkedIn button clicked!');
                window.open('https://www.linkedin.com/in/simonpadron/', '_blank');
            });
            
            // Video events
            video.addEventListener('loadeddata', () => {
                console.log('✅ Video loaded');
            });
        </script>
    
    </body>
</html>
